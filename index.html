<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Plans</title>
    <style>
        :root {
            --primary: #1db954;
            --primary-dark: #1aa34a;
            --dark: #0a0a0a;
            --darker: #000000;
            --light: #f8f9fa;
            --medium-gray: #666;
            --white: #ffffff;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .wrap { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 24px;
        }
        
        .header-main {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 80px 0 40px 0;
            min-height: 200px;
        }
        
        .logo-brand {
            width: 240px;
            height: auto;
            display: block;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 6px 20px rgba(29, 185, 84, 0.3));
            animation: gentleGlow 4s ease-in-out infinite;
        }
        
        @keyframes gentleGlow {
            0%, 100% { 
                transform: scale(1);
                filter: drop-shadow(0 6px 20px rgba(29, 185, 84, 0.3));
            }
            50% { 
                transform: scale(1.05);
                filter: drop-shadow(0 8px 25px rgba(29, 185, 84, 0.5));
            }
        }
        
        .logo-brand:hover {
            animation: vinylSpin 0.8s linear;
            filter: drop-shadow(0 10px 30px rgba(29, 185, 84, 0.7));
        }
        
        @keyframes vinylSpin {
            from { transform: rotate(0deg) scale(1.1); }
            to { transform: rotate(360deg) scale(1.1); }
        }
        
        /* HEADLINE PERFECTO - Una línea siempre */
        .headline {
            font-size: 2.5rem;
            line-height: 1.1;
            font-weight: 900;
            text-align: center;
            margin: 60px auto 80px auto;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
        }
        
        .headline-text {
            display: inline-block;
            background: linear-gradient(135deg, var(--light) 0%, var(--primary) 50%, var(--light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 0 15px;
            position: relative;
        }
        
        .headline-text::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 15px;
            right: 15px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 2px;
        }
        
        /* Resto del CSS adaptado a fondo oscuro... */
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header-main">
            <img src="logo.svg" alt="Booking Plans Logo" class="logo-brand"/>
        </div>
        
        <!-- HEADLINE CORREGIDO - UNA LÍNEA -->
        <div class="headline">
            <span class="headline-text">Inteligencia Musical. Conciencia Sonora. Dónde, cómo y cuándo.</span>
        </div>
        
        <!-- Resto del contenido con fondo oscuro... -->
    </div>
</body>
</html>
