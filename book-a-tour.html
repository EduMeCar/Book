<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=index.html#book-a-tour">
  <title>Redirecting... | BOOKING PLANS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Space Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .redirect-msg {
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #ff3300;
    }
    .redirect-msg::after {
      content: '...';
      animation: dots 1.5s steps(3, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="redirect-msg">REDIRECTING</div>
  <script>
    setTimeout(() => {
      window.location.href = 'index.html#book-a-tour';
    }, 100);
  </script>
</body>
</html>
